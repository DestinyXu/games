<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>机器人盒子</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        .game-card {
            max-width: 960px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .game-thumbnail {
            width: 100%;
            position: relative;
            padding-top: 62.5%; /* 16:10 宽高比 */
        }
        .game-thumbnail iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .game-info {
            padding: 15px;
        }
        .game-info h3 {
            margin: 0;
            color: #333;
        }
        .game-meta {
            margin-top: 5px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="game-card">
        <div class="game-thumbnail">
            <iframe 
                src="https://games.crazygames.com/en_US/robox/index.html" 
                frameborder="0" 
                allowfullscreen 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
            </iframe>
        </div>
        <div class="game-info">
            <h3>机器人盒子</h3>
            <div class="game-meta">
                <span class="game-category">动作游戏</span>
            </div>
        </div>
    </div>
</body>
</html>
